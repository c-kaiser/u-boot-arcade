# U-Boot Arcade lokal
#   docker compose up --build                 Spiel + Bots + regelbasierte Gegner
#   docker compose --profile swarm up --build zusätzlich Schwarm-Spieler (WebSocket-Last)
#   docker compose --profile llm up --build   zusätzlich LiteLLM + Ollama für die Gegner-KI
#
# Telemetrie ist reine Konfiguration (.env, siehe .env.example): Standard ist kein Export (OTEL_*_EXPORTER=none).
# Für ein Ziel auf dem eigenen Rechner OTEL_EXPORTER_OTLP_ENDPOINT=http://host.docker.internal:4317 setzen.

name: u-boot-arcade

x-java-service: &java-service
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  deploy:
    resources:
      limits:
        memory: 768M

x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
  OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
  OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-none}
  OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-none}
  OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-none}
  OTEL_RESOURCE_ATTRIBUTES: service.namespace=u-boot-arcade,deployment.environment.name=${DEPLOY_ENV:-local}
  OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-10000}
  OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}

services:
  game-server:
    <<: *java-service
    build: { context: ., args: { SERVICE: game-server } }
    image: u-boot-arcade/game-server:local
    ports:
      - "${GAME_PORT:-8088}:8080"
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: game-server
      PHYSICS_URL: http://physics:8081
      ENEMY_AI_URL: http://enemy-ai:8083
      LEADERBOARD_URL: http://leaderboard:8082
      GAME_BOTS: ${GAME_BOTS:-3}
      GAME_ENEMIES: ${GAME_ENEMIES:-2}
      GAME_LLM_ENABLED: ${GAME_LLM_ENABLED:-false}
    depends_on: [physics, enemy-ai, leaderboard]

  physics:
    <<: *java-service
    build: { context: ., args: { SERVICE: physics-service } }
    image: u-boot-arcade/physics:local
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: physics

  leaderboard:
    <<: *java-service
    build: { context: ., args: { SERVICE: leaderboard } }
    image: u-boot-arcade/leaderboard:local
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: leaderboard
      DB_URL: jdbc:h2:file:/data/leaderboard
    volumes:
      - leaderboard-data:/data

  enemy-ai:
    <<: *java-service
    build: { context: ., args: { SERVICE: enemy-ai } }
    image: u-boot-arcade/enemy-ai:local
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: enemy-ai
      LLM_BASE_URL: ${LLM_BASE_URL:-http://litellm:4000/v1}
      LLM_MODEL: ${LLM_MODEL:-enemy-brain}
      LLM_API_KEY: ${LLM_API_KEY:-sk-local}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-8000}

  player-swarm:
    <<: *java-service
    profiles: [swarm]
    build: { context: ., args: { SERVICE: player-swarm } }
    image: u-boot-arcade/player-swarm:local
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: player-swarm
      GAME_WS_URL: ws://game-server:8080/ws
      SWARM_PLAYERS: ${SWARM_PLAYERS:-10}
    depends_on: [game-server]

  # ---------- Profil "llm": Gegner-KI mit echtem Modell ----------
  litellm:
    profiles: [llm]
    image: ghcr.io/berriai/litellm:main-stable
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./deploy/litellm-config.yaml:/app/config.yaml:ro
    ports:
      - "4000:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LITELLM_OTEL_V2: "true"
      OTEL_EXPORTER: otlp_http
      OTEL_ENDPOINT: ${LITELLM_OTEL_ENDPOINT:-http://host.docker.internal:4318}
      OTEL_SERVICE_NAME: litellm
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

  ollama:
    profiles: [llm]
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama

  # Lädt das Modell einmalig herunter und beendet sich dann
  ollama-pull:
    profiles: [llm]
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["/bin/sh", "-c", "sleep 3 && ollama pull ${OLLAMA_MODEL:-qwen2.5:3b}"]
    depends_on: [ollama]
    restart: "no"

volumes:
  leaderboard-data:
  ollama-models:
