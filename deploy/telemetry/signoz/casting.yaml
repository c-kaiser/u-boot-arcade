apiVersion: v1alpha1
kind: Installation
metadata:
  name: signoz
spec:
  deployment:
    flavor: compose
    mode: docker
  signoz:
    spec:
      image: signoz/signoz:v0.146.0
      env:
        # Festes Admin-Konto samt Organisation beim Start anlegen. Ohne Organisation gibt SigNoz seinem
        # Collector (ingester) per OpAMP nur eine leere Konfiguration – dann nimmt er keine Daten an.
        # Nur für den lokalen Betrieb gedacht.
        SIGNOZ_USER_ROOT_ENABLED: "true"
        SIGNOZ_USER_ROOT_EMAIL: admin@u-boot-arcade.local
        SIGNOZ_USER_ROOT_PASSWORD: U-Boot-Arcade-1
        SIGNOZ_USER_ROOT_ORG_NAME: u-boot-arcade
  ingester:
    spec:
      image: signoz/signoz-otel-collector:v0.144.14
  metastore:
    kind: sqlite
  patches:
    - target: "deployment/compose.yaml"
      operations:
        - op: remove
          path: /services/ingester/ports
