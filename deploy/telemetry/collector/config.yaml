# Gateway-Collector: einziger OTLP-Eingang am Host. Heute alles an SigNoz;
# später zusätzlich eine Pipeline mit den GenAI-Spans an Langfuse (ADR-09).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
  batch: {}
  resource/environment:
    # SigNoz filtert nach deployment.environment, run-local.sh setzt die neuere Variante deployment.environment.name
    attributes:
      - key: deployment.environment
        from_attribute: deployment.environment.name
        action: insert

exporters:
  otlp/signoz:
    # Collector von SigNoz („ingester“), nur im Compose-Netz erreichbar
    endpoint: signoz-ingester:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/environment, batch]
      exporters: [otlp/signoz]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource/environment, batch]
      exporters: [otlp/signoz]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/environment, batch]
      exporters: [otlp/signoz]
