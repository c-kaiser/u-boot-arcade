{{- $name := "postgres" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "uboot.svc" (list . $name) }}
  labels:
    {{- include "uboot.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.postgres.password | quote }}
{{- if .Values.postgres.enabled }}
---
# Bewusst einfach: Daten liegen in einem emptyDir und sind nach einem Pod-Neustart weg.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "uboot.svc" (list . $name) }}
  labels:
    {{- include "uboot.labels" . | nindent 4 }}
    {{- include "uboot.selector" (list . $name) | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "uboot.selector" (list . $name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "uboot.labels" . | nindent 8 }}
        {{- include "uboot.selector" (list . $name) | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "uboot.svc" (list . $name) }}
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}, "-d", {{ .Values.postgres.database | quote }}]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "uboot.svc" (list . $name) }}
  labels:
    {{- include "uboot.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "uboot.selector" (list . $name) | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
{{- end }}
