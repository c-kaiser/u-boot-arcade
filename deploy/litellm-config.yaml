# LiteLLM-Proxy für die Gegner-KI. Der Game-Server ruft immer das Modell "enemy-brain" auf,
# welches echte Modell dahintersteckt, wird nur hier entschieden.
# Kein lokales Modell (ADR-14): ANTHROPIC_API_KEY setzen. Jeder Aufruf kostet Geld.
model_list:
  - model_name: enemy-brain
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY

litellm_settings:
  callbacks: ["otel"]
  # Bei langsamen Antworten lieber abbrechen als das Spiel blockieren
  request_timeout: 30
