<!doctype html>
<html lang="de" data-title-suffix=" – Admin">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>U-Boot Arcade – Admin</title>
  <link rel="stylesheet" href="style.css">
  <style>
    main { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
    label { display: grid; grid-template-columns: 1fr 120px 60px; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px dotted var(--line); font-size: 14px; }
    label small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
    input[type=range] { width: 120px; }
    output { text-align: right; }
    .toggle { grid-template-columns: 1fr 24px; }
    label input[type=checkbox] { width: 18px; height: 18px; }
    #saved { color: var(--ok); font-size: 13px; min-height: 18px; }
    pre { font-size: 12px; color: var(--muted); white-space: pre-wrap; }
  </style>
</head>
<body>
<header>
  <h1>Admin &amp; Chaos</h1>
  <nav><button id="theme-toggle" type="button">Variante</button> <a href="index.html">Zum Spiel</a></nav>
</header>
<main>
  <section class="panel">
    <h3 data-t="crew">Besatzung</h3>
    <label><span data-t="bots"></span>
      <input type="range" id="bots" min="0" max="60" step="1"><output for="bots"></output></label>
    <label><span data-t="enemies"></span>
      <input type="range" id="enemies" min="0" max="5" step="1"><output for="enemies"></output></label>
    <label class="toggle"><span data-t="llm"></span>
      <input type="checkbox" id="llmEnabled"></label>
  </section>

  <section class="panel">
    <h3>Technisches Chaos</h3>
    <label><span>Physik-Latenz<small>Jeder Physik-Step wird verzögert (ms)</small></span>
      <input type="range" id="physicsLatencyMs" min="0" max="500" step="10"><output for="physicsLatencyMs"></output></label>
    <label><span>Physik-Fehlerrate<small>Anteil fehlschlagender Steps (Welt friert ein)</small></span>
      <input type="range" id="physicsErrorRate" min="0" max="1" step="0.05"><output for="physicsErrorRate"></output></label>
    <label><span>Leaderboard langsam<small>Verzögerung pro Eintrag (ms)</small></span>
      <input type="range" id="leaderboardSlowMs" min="0" max="5000" step="100"><output for="leaderboardSlowMs"></output></label>
    <label><span data-t="aiLatency"></span>
      <input type="range" id="aiLatencyMs" min="0" max="5000" step="100"><output for="aiLatencyMs"></output></label>
    <label class="toggle"><span data-t="aiRunaway"></span>
      <input type="checkbox" id="aiRunaway"></label>
    <label class="toggle"><span>Memory Leak im Game-Server<small>Heap wächst ~1,3 MB/s bis zum Abschalten</small></span>
      <input type="checkbox" id="gameServerMemoryLeak"></label>
  </section>

  <section class="panel">
    <h3>Fachliches Chaos</h3>
    <label class="toggle"><span data-t="boiler"></span>
      <input type="checkbox" id="boilerCoolingBroken"></label>
    <label class="toggle"><span data-t="leak"></span>
      <input type="checkbox" id="hullLeak"></label>
    <label><span data-t="current"></span>
      <input type="range" id="current" min="-5" max="5" step="0.5"><output for="current"></output></label>
    <p id="saved"></p>
  </section>

  <section class="panel">
    <h3>Status</h3>
    <pre id="status">lade …</pre>
  </section>
</main>

<script src="theme.js"></script>
<script>
(() => {
  const top = ["bots", "enemies", "llmEnabled"];
  const chaosFields = ["physicsLatencyMs", "physicsErrorRate", "leaderboardSlowMs", "aiLatencyMs", "aiRunaway",
                       "gameServerMemoryLeak", "boilerCoolingBroken", "hullLeak", "current"];
  const el = (id) => document.getElementById(id);
  let settings = null;

  function show(s) {
    settings = s;
    for (const k of top) setField(k, s[k]);
    for (const k of chaosFields) setField(k, s.chaos[k]);
  }
  function setField(k, v) {
    const input = el(k);
    if (input.type === "checkbox") input.checked = !!v; else input.value = v;
    const out = document.querySelector(`output[for=${k}]`);
    if (out) out.textContent = input.value;
  }
  function read(k) {
    const input = el(k);
    return input.type === "checkbox" ? input.checked : Number(input.value);
  }

  let timer = null;
  function save() {
    clearTimeout(timer);
    timer = setTimeout(async () => {
      const body = { ...settings, chaos: { ...settings.chaos } };
      for (const k of top) body[k] = read(k);
      for (const k of chaosFields) body.chaos[k] = read(k);
      const res = await fetch("api/admin/settings", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      show(await res.json());
      el("saved").textContent = "Gespeichert " + new Date().toLocaleTimeString();
    }, 200);
  }

  for (const k of [...top, ...chaosFields]) {
    el(k).addEventListener("input", () => {
      const out = document.querySelector(`output[for=${k}]`);
      if (out) out.textContent = el(k).value;
      save();
    });
  }

  fetch("api/admin/settings").then((r) => r.json()).then(show);
  async function status() {
    try { el("status").textContent = JSON.stringify(await (await fetch("api/status")).json(), null, 2); } catch (e) {}
  }
  setInterval(status, 2000);
  status();
})();
</script>
</body>
</html>
