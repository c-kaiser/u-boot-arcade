<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>U-Boot Arcade</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1 data-t="title">U-Boot Arcade</h1>
  <p class="tagline" data-t="tagline"></p>
  <nav><button id="theme-toggle" type="button">Variante</button> <a href="admin.html" target="_blank">Admin &amp; Chaos</a></nav>
</header>

<main>
  <section class="stage">
    <canvas id="sea" width="1600" height="600" aria-label="Spielfeld"></canvas>
    <div id="join" class="overlay">
      <form id="join-form">
        <h2 data-t="joinTitle">Bereit zum Tauchen?</h2>
        <input id="name" maxlength="16" placeholder="Dein Name" autocomplete="off" required>
        <button type="submit" data-t="joinButton">Abtauchen!</button>
        <p class="hint" data-t="hint"></p>
      </form>
    </div>
    <div id="dead" class="overlay hidden"><p><span data-t="dead">Versenkt!</span><br><span id="respawn"></span></p></div>
    <div id="frozen" class="banner hidden">Physik-Service antwortet nicht – die Welt steht still</div>
  </section>

  <aside>
    <div class="panel">
      <h3 data-t="panelSelf">Dein Boot</h3>
      <dl class="gauges">
        <dt data-t="depth">Tiefe</dt><dd><span id="g-depth">–</span> <span data-t="depthUnit">m</span></dd>
        <dt data-t="speed">Fahrt</dt><dd><span id="g-speed">–</span> <span data-t="speedUnit">kn</span></dd>
        <dt data-t="pressure">Dampfdruck</dt><dd><meter id="g-pressure" min="0" max="12" low="8" high="9.5" optimum="5"></meter> <span id="g-pressure-v">–</span> <span data-t="pressureUnit">bar</span></dd>
        <dt data-only="uboot">Kessel</dt><dd data-only="uboot"><span id="g-temp">–</span> °C</dd>
        <dt data-t="hull">Rumpf</dt><dd><meter id="g-hull" min="0" max="100" low="30" high="70" optimum="100"></meter> <span id="g-hull-v">–</span> %</dd>
        <dt>Punkte</dt><dd><span id="g-score">0</span> · <span id="g-kills">0</span> <span data-t="kills">Abschüsse</span></dd>
      </dl>
    </div>
    <div class="panel">
      <h3>Verbindung</h3>
      <dl class="gauges">
        <dt>Round-Trip</dt><dd><span id="g-rtt">–</span> ms</dd>
        <dt>Updates</dt><dd><span id="g-ups">–</span> /s</dd>
        <dt>Gegner-KI</dt><dd id="g-llm">–</dd>
      </dl>
      <ul id="chaos" class="chaos"></ul>
    </div>
    <div class="panel">
      <h3 data-t="panelEvents">Funkspruch</h3>
      <ul id="events" class="events"></ul>
    </div>
    <div class="panel">
      <h3>Bestenliste</h3>
      <ol id="leaderboard" class="leaderboard"></ol>
    </div>
  </aside>
</main>

<script src="theme.js"></script>
<script src="game.js"></script>
</body>
</html>
