server:
  port: ${PORT:8082}
spring:
  application:
    name: leaderboard
  datasource:
    # Eingebettete H2-Datei-DB; im Container per DB_URL auf ein Volume gelegt
    url: ${DB_URL:jdbc:h2:file:./data/leaderboard}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
  sql:
    init:
      mode: always
management:
  endpoints:
    web:
      exposure:
        include: health
